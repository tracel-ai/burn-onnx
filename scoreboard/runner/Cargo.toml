[package]
name = "burn-onnx-runner"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
burn = { git = "https://github.com/tracel-ai/burn", default-features = false, features = ["std", "flex"], rev = "ee39002d94e1c958d86a65e92132b3961d48c18c" }
burn-store = { git = "https://github.com/tracel-ai/burn", default-features = false, features = ["std"], rev = "ee39002d94e1c958d86a65e92132b3961d48c18c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
debug = false
